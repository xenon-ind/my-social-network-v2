[project]
name = "delta-social-network"
version = "0.1.0"
description = "Multifunctional self-hosted federative configurable client-server social-network."
authors = [
    {name = "Your Name",email = "you@example.com"}
]

license = "GPLv3"
requires-python = ">=3.14,<3.15"

dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "platformdirs (>=4.11.8,<5.0.0)",
    "pythonnet (>=3.0)",
    "pywebview (>=6.2.1,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "client", from = "src"},
    {include = "server", from = "src"}
]

[tool.poetry.scripts]
deltanet-server = "src.server:main"
deltanet-client = "src.client:main"
